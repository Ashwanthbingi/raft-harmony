version: '3.8'

services:
  # Node 1 - Initial Leader
  node1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: raft-node-1
    hostname: node1
    ports:
      - "8001:8000"  # HTTP API
      - "9001:9000"  # Raft gRPC
    environment:
      LOG_LEVEL: INFO
      DATA_DIR: /app/data
    volumes:
      - node1_data:/app/data
    command:
      - ./raft-node
      - -id=1
      - -http_addr=:8000
      - -raft_addr=:9000
      - -peers=node2:9000,node3:9000
    networks:
      - raft-network
    restart: unless-stopped
    depends_on:
      - node2
      - node3

  # Node 2 - Follower
  node2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: raft-node-2
    hostname: node2
    ports:
      - "8002:8000"  # HTTP API
      - "9002:9000"  # Raft gRPC
    environment:
      LOG_LEVEL: INFO
      DATA_DIR: /app/data
    volumes:
      - node2_data:/app/data
    command:
      - ./raft-node
      - -id=2
      - -http_addr=:8000
      - -raft_addr=:9000
      - -peers=node1:9000,node3:9000
    networks:
      - raft-network
    restart: unless-stopped

  # Node 3 - Follower
  node3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: raft-node-3
    hostname: node3
    ports:
      - "8003:8000"  # HTTP API
      - "9003:9000"  # Raft gRPC
    environment:
      LOG_LEVEL: INFO
      DATA_DIR: /app/data
    volumes:
      - node3_data:/app/data
    command:
      - ./raft-node
      - -id=3
      - -http_addr=:8000
      - -raft_addr=:9000
      - -peers=node1:9000,node2:9000
    networks:
      - raft-network
    restart: unless-stopped

  # Frontend Dashboard (TanStack Start + Nitro)
  # Runs on port 8080, accessible via http://localhost:8080
  # Communicates with backend nodes via the raft-network Docker bridge
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: raft-frontend
    hostname: frontend
    ports:
      - "8080:3000"  # Frontend on port 3000 (Nitro node-server default), mapped to 8080 on host
    environment:
      # Backend node addresses for frontend client-side API calls (browser)
      # Using host-mapped ports (8001-8003) so the browser can reach them via localhost
      VITE_RAFT_NODES: "http://localhost:8001,http://localhost:8002,http://localhost:8003"
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
    networks:
      - raft-network
    restart: unless-stopped
    depends_on:
      - node1
      - node2
      - node3

volumes:
  node1_data:
    driver: local
  node2_data:
    driver: local
  node3_data:
    driver: local

networks:
  raft-network:
    driver: bridge

