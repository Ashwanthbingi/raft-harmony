# Extended docker-compose.yml with Prometheus, Grafana, and Frontend Dashboard
version: '3.8'

services:
  node1:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
      - "9001:9000"
    environment:
      - NODE_ID=1
      - PEERS=node2:9000,node3:9000
    volumes:
      - node1_data:/app/data
    networks:
      - raft-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  node2:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8002:8000"
      - "9002:9000"
    environment:
      - NODE_ID=2
      - PEERS=node1:9000,node3:9000
    volumes:
      - node2_data:/app/data
    networks:
      - raft-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      - node1

  node3:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8003:8000"
      - "9003:9000"
    environment:
      - NODE_ID=3
      - PEERS=node1:9000,node2:9000
    volumes:
      - node3_data:/app/data
    networks:
      - raft-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      - node1

  # Frontend Dashboard (TanStack Start + Nitro)
  # Runs on port 8080, accessible via http://localhost:8080
  # Provides UI for interacting with the Raft cluster
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: raft-frontend
    hostname: frontend
    ports:
      - "8080:3000"  # Frontend on port 3000 (Nitro node-server default), mapped to 8080 on host
    environment:
      # Backend node addresses for frontend client-side API calls (browser)
      # Using host-mapped ports (8001-8003) so the browser can reach them via localhost
      VITE_RAFT_NODES: "http://localhost:8001,http://localhost:8002,http://localhost:8003"
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
    networks:
      - raft-network
    restart: unless-stopped
    depends_on:
      - node1
      - node2
      - node3

  # Prometheus: Time-series database for metrics
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-rules.yml:/etc/prometheus/rules/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    networks:
      - raft-network
    depends_on:
      - node1
      - node2
      - node3

  # Grafana: Visualization and dashboarding
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"  # Changed from 3000 to 3001 to avoid conflict with frontend on 3000 (internally)
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./grafana-dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      - raft-network
    depends_on:
      - prometheus

volumes:
  node1_data:
  node2_data:
  node3_data:
  prometheus_data:
  grafana_data:

networks:
  raft-network:
    driver: bridge
