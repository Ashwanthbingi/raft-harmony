global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'raft-kv'
    environment: 'production'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - '/etc/prometheus/rules/*.yml'

scrape_configs:
  # Raft cluster nodes
  - job_name: 'raft-cluster'
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: '/metrics'
    scheme: http
    static_configs:
      - targets: ['node1:8000', 'node2:8000', 'node3:8000']
        labels:
          cluster: 'raft-kv'
          env: 'production'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '([^:]+)(?::\d+)?'
        replacement: '${1}'
      - source_labels: [__scheme__]
        target_label: scheme

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    scrape_interval: 15s
    static_configs:
      - targets: ['localhost:9090']
