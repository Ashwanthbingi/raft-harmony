syntax = "proto3";

package rpc;

option go_package = "./rpc";

// RaftService defines the core Raft consensus methods.
service RaftService {
  // RequestVote is invoked by candidates to gather votes.
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);

  // AppendEntries is invoked by the leader to replicate log entries
  // and maintain heartbeats.
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);

  // InstallSnapshot is invoked by the leader to transfer snapshots to followers
  rpc InstallSnapshot(InstallSnapshotRequest) returns (InstallSnapshotResponse);
}

// RequestVoteRequest arguments.
message RequestVoteRequest {
  int32 term = 1;          // candidate's term
  string candidate_id = 2; // candidate requesting vote
  int32 last_log_index = 3; // index of candidate's last log entry
  int32 last_log_term = 4;  // term of candidate's last log entry
}

// RequestVoteResponse results.
message RequestVoteResponse {
  int32 term = 1;        // currentTerm, for candidate to update itself
  bool vote_granted = 2; // true means candidate received vote
}

// LogEntry is a single log entry.
message LogEntry {
  int32 index = 1;
  int32 term = 2;
  string command = 3; // e.g. "SET key value"
}

// AppendEntriesRequest arguments.
message AppendEntriesRequest {
  int32 term = 1;              // leader's term
  string leader_id = 2;        // so follower can redirect clients
  int32 prev_log_index = 3;    // index of log entry immediately preceding new ones
  int32 prev_log_term = 4;     // term of prevLogIndex entry
  repeated LogEntry entries = 5; // log entries to store (empty for heartbeat)
  int32 leader_commit = 6;     // leader's commitIndex
}

// AppendEntriesResponse results.
message AppendEntriesResponse {
  int32 term = 1;    // currentTerm, for leader to update itself
  bool success = 2;  // true if follower contained entry matching prevLogIndex and prevLogTerm
}

// InstallSnapshotRequest arguments.
message InstallSnapshotRequest {
  int32 term = 1;                    // leader's term
  string leader_id = 2;              // so follower can redirect clients
  int32 last_included_index = 3;     // the snapshot replaces all entries up to and including this index
  int32 last_included_term = 4;      // term of last_included_index
  int32 offset = 5;                  // byte offset where snapshot data starts
  bytes data = 6;                    // raw snapshot bytes
  bool done = 7;                     // true if this is the last chunk
}

// InstallSnapshotResponse results.
message InstallSnapshotResponse {
  int32 term = 1;  // currentTerm, for leader to update itself
}

// Membership Change Request
// Used to add or remove nodes from the cluster
message MembershipChangeRequest {
  string node_id = 1;      // ID of the node to add/remove
  string node_address = 2; // gRPC address (e.g. "10.0.1.10:9000")
  string action = 3;       // "ADD" or "REMOVE"
}

// Membership Change Response
message MembershipChangeResponse {
  bool success = 1;
  string message = 2;
  int32 term = 3;
}
